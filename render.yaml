# Render blueprint for STACKUP.
#
# IMPORTANT (ADR-002): no PostgreSQL is defined here. The database is Neon,
# never Render's free Postgres. Render hosts compute only.
#
# Region: ohio — same metro as the STACKUP Neon project (aws-us-east-2) to
# minimize FastAPI <-> PostgreSQL latency (ADR-007).
#
# Secrets (DATABASE_URL, SENTRY_DSN, etc.) are set in the Render dashboard,
# never committed — every secret below is `sync: false`.
#
# ENVIRONMENT is `staging` until object storage (R2) is configured: the app
# refuses to start in `production` without R2 (ADR-006). staging still forbids
# SQLite and the dev AUTH_SECRET and uses Secure cookies. Switch to
# `production` once STORAGE_* is set. Evidence uploads use an in-process store
# until then (lost on restart) — everything else is fully durable in Neon.

services:
  - type: web
    name: stackup-api
    runtime: python
    region: ohio
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn stackup_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql+asyncpg://...)
      - key: AUTH_SECRET
        sync: false # strong random secret; signs reset/verify tokens
      - key: FRONTEND_ORIGIN
        sync: false # the Vercel frontend URL, e.g. https://stackup-web.vercel.app
      - key: SENTRY_DSN
        sync: false
      # Object storage (R2) — set these, then flip ENVIRONMENT to production.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  # The arq background worker is added in Phase 7 (ADR-005). It will be a
  # second service of type `worker` in this blueprint, sharing rootDir
  # apps/api and reading the same DATABASE_URL plus REDIS_URL (Upstash).
  #
  # - type: worker
  #   name: stackup-worker
  #   runtime: python
  #   region: virginia
  #   plan: free
  #   rootDir: apps/api
  #   buildCommand: pip install uv && uv sync
  #   startCommand: uv run arq stackup_api.worker.settings.WorkerSettings

# Database migrations run as an explicit step, not inside web startup
# (avoids races between instances). On Render this is a one-off job or the
# paid preDeployCommand: `uv run alembic upgrade head`. See
# docs/operations/deployment.md.
