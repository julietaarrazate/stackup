# Render blueprint for STACKUP.
#
# IMPORTANT (ADR-002): no PostgreSQL is defined here. The database is Neon,
# never Render's free Postgres. Render hosts compute only.
#
# Region: ohio — same metro as the STACKUP Neon project (aws-us-east-2) to
# minimize FastAPI <-> PostgreSQL latency (ADR-007).
#
# Secrets (DATABASE_URL, SENTRY_DSN, etc.) are set in the Render dashboard,
# never committed — every secret below is `sync: false`.
#
# ENVIRONMENT is `production` on stackup-api as of the R2/Resend/GitHub
# OAuth credential rollout (see docs/product/session-log.md) — R2 is
# configured for real, so the app boots in production mode (ADR-006: it
# refuses to start in `production` without R2). If STORAGE_* is ever
# unset again this must drop back to `staging` or the app won't boot.

services:
  - type: web
    name: stackup-api
    runtime: python
    region: ohio
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn stackup_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql+asyncpg://...)
      - key: AUTH_SECRET
        sync: false # strong random secret; signs reset/verify tokens
      - key: FRONTEND_ORIGIN
        sync: false # the Vercel frontend URL, e.g. https://stackup-web.vercel.app
      - key: SENTRY_DSN
        sync: false
      # Object storage (R2) — configured for real.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # GitHub integration (Phase 8) — an OAuth App, configured for real.
      # Without it, /integrations/github routes would 404 rather than error.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  # arq background worker (Phase 7, ADR-005). NOT CURRENTLY DEPLOYED — see
  # docs/product/session-log.md and production-readiness.md. Render's free
  # tier doesn't cover Background Workers (only Web Services), and paying
  # for one was declined for now since the only job today
  # (auto_end_expired_costs, daily) is a convenience, not a correctness
  # requirement — costs can be marked "ended" manually in the UI. `plan:
  # free` below is what the blueprint would request; verify against
  # Render's current pricing before actually creating this service, it
  # may require a paid plan. Shares the apps/api codebase and DATABASE_URL
  # with the web service; needs its own REDIS_URL. A REDIS_URL already
  # exists (Redis Cloud free tier) but currently sits unused on
  # stackup-api instead, since this service was never created.
  - type: worker
    name: stackup-worker
    runtime: python
    region: ohio
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync
    startCommand: uv run arq stackup_api.worker.settings.WorkerSettings
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # same Neon connection string as stackup-api
      - key: REDIS_URL
        sync: false # Redis Cloud (or Upstash) — redis:// or rediss://
      - key: SENTRY_DSN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

# Database migrations run as an explicit step, not inside web startup
# (avoids races between instances). On Render this is a one-off job or the
# paid preDeployCommand: `uv run alembic upgrade head`. See
# docs/operations/deployment.md.
