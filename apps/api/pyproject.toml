[project]
name = "stackup-api"
version = "0.1.0"
description = "STACKUP backend — cost intelligence for software and startups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124,<0.125",
    "uvicorn[standard]>=0.34,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "alembic>=1.16,<1.17",
    "asyncpg>=0.30,<0.31",
    "structlog>=24.4,<26",
    "sentry-sdk[fastapi]>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackup_api"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
# TCH (type-checking-only imports) is intentionally excluded: FastAPI and
# Pydantic resolve annotations at runtime (dependency injection, get_type_hints),
# so moving those imports behind `if TYPE_CHECKING` would break the app.
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["stackup_api"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
